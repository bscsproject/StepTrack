
name: step_track
description: "StepTrack - Flutter Step Tracking Application"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - app_mockup/steptrack_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "app_mockup/steptrack_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#101329"
  image: app_mockup/steptrack_logo.png
  android: true
  ios: false
  web: false

  android_12:
    color: "#101329"
    image: app_mockup/steptrack_logo.png
